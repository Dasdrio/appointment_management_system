services:
    mysql:
        image: mysql:8.0
        container_name: appointment_managment_system
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: appointment_managment
            MYSQL_USER: root
            MYSQL_PASSWORD: rootpassword
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: phpmyadmin_userinterface
        restart: always
        environment:
            PMA_HOST: mysql
            MYSQL_ROOT_PASSWORD: rootpassword
        ports:
            - "8081:80"
        depends_on:
            - mysql
volumes:
    mysql_data: